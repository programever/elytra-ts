name: Publish

on:
  push:
    branches: [main]

# Never let two publishes race; queue them instead of cancelling, so a run that
# is already talking to the registry is allowed to finish.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    # Named here because the NPM_TOKEN secret lives on this environment.
    environment:
      name: Production
      url: https://www.npmjs.com/package/elytra-ts
    permissions:
      contents: write # push the version tag
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          registry-url: https://registry.npmjs.org

      # Every push to main runs this workflow, but only a version bump should
      # publish. Re-publishing an existing version is rejected by the registry,
      # so check first and skip quietly instead of failing the run.
      - name: Decide whether to publish
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm - nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME@$VERSION is new - will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      # Built explicitly rather than relying only on a publish hook, so that
      # dropping that script cannot silently ship an empty package.
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      # A tarball without the dual builds still publishes successfully and
      # breaks every consumer, so install the packed tarball into a scratch
      # project and import it both ways before handing it to the registry.
      - name: Verify the tarball is consumable as CJS and ESM
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          TARBALL="$(npm pack --silent)"
          WORKDIR="$(mktemp -d)"
          mv "$TARBALL" "$WORKDIR/"
          cd "$WORKDIR"
          npm init -y >/dev/null
          npm install "./$TARBALL" --silent
          node -e "
            const { ok, partitionResult } = require('elytra-ts');
            if (partitionResult([ok(1)]).oks[0] !== 1) throw new Error('CJS require broken');
            console.log('CJS require OK');
          "
          node --input-type=module -e "
            import { ok, partitionResult } from 'elytra-ts';
            if (partitionResult([ok(1)]).oks[0] !== 1) throw new Error('ESM import broken');
            console.log('ESM import OK');
          "

      - name: Publish to npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the release
        if: steps.version.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists - skipping."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
